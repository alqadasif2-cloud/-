name: Backend CI & API Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Build & REST API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Build Backend (TypeScript Compiler)
        working-directory: ./backend
        run: npm run build

      - name: Run REST API Automated Verification
        working-directory: ./backend
        run: npx tsx src/test-rest-apis.ts
